<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Catatan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
<style>
:root{--bg:#f4f3f0;--panel:#fff;--text:#1c1c1c;--sub:#6b6b6b;--accent:#7a5cff;--border:#e4e2dd;--danger:#e0554a}
@media (prefers-color-scheme:dark){:root{--bg:#171717;--panel:#222;--text:#eee;--sub:#999;--border:#333}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
#login{display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px;max-width:340px;width:100%}
#login h1{font-size:18px;margin:0}
#login p{color:var(--sub);font-size:13px;margin:0;text-align:center}
#email{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:15px}
#sendBtn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#sendBtn:disabled{opacity:.6}
#msg{font-size:12px;color:var(--sub);text-align:center;min-height:16px}
#msg.err{color:var(--danger)}
#app{display:none;width:100%;height:100%;max-width:880px;margin:0 auto}
.wrap{display:flex;height:100%}
#sidebar{width:220px;min-width:220px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--panel)}
#sidebarHead{padding:14px;display:flex;gap:8px;border-bottom:1px solid var(--border)}
#search{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px}
#newBtn{width:32px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:18px;cursor:pointer}
#list{flex:1;overflow-y:auto}
.item{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.item.active,.item:hover{background:var(--bg)}
.item.active{border-left:3px solid var(--accent)}
.item .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:11px;color:var(--sub);margin-top:2px}
.empty{padding:20px 14px;color:var(--sub);font-size:12px}
#foot{padding:8px 14px;font-size:11px;color:var(--sub);border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#logoutBtn{background:none;border:none;color:var(--sub);font-size:11px;text-decoration:underline;cursor:pointer}
#editor{flex:1;display:none;flex-direction:column;min-width:0}
#editorHead{padding:10px 16px;display:flex;gap:8px;border-bottom:1px solid var(--border)}
#titleInput{flex:1;min-width:0;border:none;background:none;font-size:16px;font-weight:600;color:var(--text);outline:none}
#delBtn{border:none;background:none;color:var(--sub);cursor:pointer;font-size:14px}
#delBtn:hover{color:var(--danger)}
#bodyInput{flex:1;border:none;background:none;padding:16px;font-size:14px;line-height:1.6;color:var(--text);outline:none;resize:none;font-family:inherit}
#noNote{flex:1;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
@media (max-width:600px){#sidebar{width:150px;min-width:150px}}
</style>
</head>
<body>

<div id="login">
  <h1>🔒 Catatan Pribadi</h1>
  <p>Masukkan email untuk menerima link login.</p>
  <input id="email" type="email" placeholder="email@kamu.com" autocomplete="email">
  <button id="sendBtn">Kirim link login</button>
  <div id="msg"></div>
</div>

<div id="app">
  <div class="wrap">
    <div id="sidebar">
      <div id="sidebarHead"><input id="search" placeholder="Cari..."><button id="newBtn">+</button></div>
      <div id="list"></div>
      <div id="foot"><span id="status">☁️ Tersimpan</span><button id="logoutBtn">Keluar</button></div>
    </div>
    <div id="editor">
      <div id="editorHead"><input id="titleInput" placeholder="Judul..."><button id="delBtn" title="Hapus">🗑</button></div>
      <textarea id="bodyInput" placeholder="Tulis sesuatu..."></textarea>
    </div>
    <div id="noNote">Pilih atau buat catatan baru</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://xoxxtdbucnlmtrubypza.supabase.co';
const SUPABASE_KEY='sb_publishable_hz3H4ldR-ipFwFx9pnjuiw_Jhr0H51U';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
let notes=[],activeId=null,timer=null;

/* ---------- LOGIN ---------- */
function say(t,err){$('msg').textContent=t;$('msg').className=err?'err':''}
$('sendBtn').onclick=async()=>{
  const email=$('email').value.trim();
  if(!email){say('Isi email dulu',true);return}
  $('sendBtn').disabled=true;say('Mengirim...');
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
  $('sendBtn').disabled=false;
  if(error)say(error.message,true);else say('Cek emailmu, klik link untuk masuk.');
};
$('email').addEventListener('keydown',e=>{if(e.key==='Enter')$('sendBtn').click()});
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};

async function start(session){
  if(!session){$('login').style.display='flex';$('app').style.display='none';return}
  $('login').style.display='none';$('app').style.display='block';
  const {data,error}=await sb.from('notes').select('*').order('updated_at',{ascending:false});
  if(error){$('status').textContent='⚠️ Gagal memuat';return}
  notes=data;render();
}
sb.auth.onAuthStateChange((ev,session)=>{if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN'||ev==='SIGNED_OUT')start(session)});

/* ---------- NOTES ---------- */
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
function render(){
  const f=$('search').value.toLowerCase();
  const rows=notes.filter(n=>(n.title+n.body).toLowerCase().includes(f));
  $('list').innerHTML=rows.length?'':'<div class="empty">'+(notes.length?'Tidak ada hasil':'Belum ada catatan')+'</div>';
  rows.forEach(n=>{
    const d=document.createElement('div');
    d.className='item'+(n.id===activeId?' active':'');
    d.innerHTML='<div class="t">'+esc(n.title||'Tanpa judul')+'</div><div class="d">'+new Date(n.updated_at).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</div>';
    d.onclick=()=>select(n.id);
    $('list').appendChild(d);
  });
}
function select(id){
  activeId=id;const n=notes.find(x=>x.id===id);if(!n)return;
  $('titleInput').value=n.title;$('bodyInput').value=n.body;
  $('editor').style.display='flex';$('noNote').style.display='none';render();
}
$('newBtn').onclick=async()=>{
  const n={id:crypto.randomUUID(),title:'',body:'',updated_at:new Date().toISOString()};
  notes.unshift(n);select(n.id);$('titleInput').focus();
  const {error}=await sb.from('notes').insert({id:n.id,title:'',body:''});
  if(error)$('status').textContent='⚠️ Gagal menyimpan';
};
function queueSave(){
  $('status').textContent='… menyimpan';
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    const n=notes.find(x=>x.id===activeId);if(!n)return;
    n.title=$('titleInput').value;n.body=$('bodyInput').value;n.updated_at=new Date().toISOString();
    const {error}=await sb.from('notes').update({title:n.title,body:n.body,updated_at:n.updated_at}).eq('id',n.id);
    $('status').textContent=error?'⚠️ Gagal menyimpan':'☁️ Tersimpan';
    render();
  },600);
}
$('titleInput').addEventListener('input',queueSave);
$('bodyInput').addEventListener('input',queueSave);
$('search').addEventListener('input',render);
$('delBtn').onclick=async()=>{
  if(!activeId||!confirm('Hapus catatan ini?'))return;
  const id=activeId;notes=notes.filter(n=>n.id!==id);activeId=null;
  $('editor').style.display='none';$('noNote').style.display='flex';render();
  await sb.from('notes').delete().eq('id',id);
};
</script>
</body>
</html>
